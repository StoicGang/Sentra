name: "Bug Report"
description: "Report a bug in Sentra (vault, CLI, encryption, etc.)"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill in the details below so we can reproduce and fix it.

  - type: dropdown
    id: component
    attributes:
      label: "Component"
      description: "Which part of Sentra is affected?"
      options:
        - Vault (add/get/update/delete/search)
        - CLI / Interactive Shell
        - Encryption / Key Derivation
        - Backup / Import / Export
        - TOTP
        - Recovery
        - P2P Sync
        - Daemon / Network
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: "Bug Description"
      description: "A clear and concise description of the bug."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "Exact commands or actions to reproduce the bug."
      placeholder: |
        1. Run `python main.py ...`
        2. Enter '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What should have happened?"

  - type: textarea
    id: actual
    attributes:
      label: "Actual Behavior"
      description: "What actually happened? Include error messages and logs."

  - type: textarea
    id: environment
    attributes:
      label: "Environment"
      description: "OS, Python version, and any relevant config."
      placeholder: |
        - OS: Windows 11 / Kali Linux 2026.1
        - Python: 3.12.x
        - Sentra version: (git branch/commit)
    validations:
      required: true
